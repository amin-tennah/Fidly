<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ton code de connexion Rézone</title>
  </head>
  <body
    style="
      margin: 0;
      padding: 24px 16px;
      background-color: #fff4e6;
      font-family:
        -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial,
        sans-serif;
      color: #0e1f17;
    "
  >
    <table
      role="presentation"
      width="100%"
      cellpadding="0"
      cellspacing="0"
      style="max-width: 440px; margin: 0 auto; background-color: #ffffff; border-radius: 20px; overflow: hidden;"
    >
      <tr>
        <td style="background-color: #0a5c3a; padding: 20px 24px;">
          <img
            src="{{ .SiteURL }}/brand/icon-192.png"
            width="44"
            height="44"
            alt="Rézone"
            style="display: inline-block; vertical-align: middle; border-radius: 10px;"
          />
          <span
            style="
              display: inline-block;
              vertical-align: middle;
              margin-left: 10px;
              font-size: 26px;
              font-weight: 800;
              letter-spacing: -1px;
              color: #fff4e6;
            "
          >
            rézone
          </span>
        </td>
      </tr>
      <tr>
        <td style="padding: 28px 24px;">
          <h1
            style="
              margin: 0 0 8px;
              font-size: 22px;
              font-weight: 800;
              color: #0e1f17;
            "
          >
            Ton code de connexion
          </h1>
          <p
            style="
              margin: 0 0 20px;
              font-size: 15px;
              line-height: 1.5;
              color: #4a5a52;
            "
          >
            Saisis ce code à 6 chiffres dans l&apos;application Rézone pour
            retrouver ta carte de fidélité :
          </p>
          <div
            style="
              margin: 0 0 20px;
              padding: 16px;
              text-align: center;
              background-color: #c8f25a;
              border-radius: 16px;
              font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
              font-size: 32px;
              font-weight: 800;
              letter-spacing: 8px;
              color: #0a5c3a;
            "
          >
            {{ .Token }}
          </div>
          <p
            style="
              margin: 0;
              font-size: 13px;
              line-height: 1.5;
              color: #4a5a52;
            "
          >
            Ce code est strictement personnel et expire automatiquement. Si tu
            n&apos;es pas à l&apos;origine de cette demande, ignore simplement
            cet email.
          </p>
        </td>
      </tr>
    </table>
  </body>
</html>
